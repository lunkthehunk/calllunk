<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CallLunk</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #e8242c;
      --dark: #0f0f0f;
      --cream: #f5f0e8;
      --yellow: #f5c518;
    }

    body {
      background: var(--dark);
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 10;
    }

    .container {
      text-align: center;
      padding: 2rem 1rem;
      position: relative;
      animation: fadeUp 0.8s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 15vw, 9rem);
      letter-spacing: 0.04em;
      line-height: 0.9;
      color: var(--cream);
      animation: fadeUp 0.6s ease both;
    }

    .headline span {
      color: var(--red);
    }

    .photo-ring {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      margin: 2rem auto;
      position: relative;
      animation: fadeUp 0.7s 0.1s ease both;
    }

    .photo-ring::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(var(--red), var(--yellow), var(--red), var(--yellow), var(--red));
      animation: spin 4s linear infinite;
      z-index: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .photo-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      position: relative;
      z-index: 1;
      border: 6px solid var(--dark);
      display: block;
    }

    .tagline {
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.7s 0.2s ease both;
    }

    .call-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--red);
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 0.1em;
      padding: 1rem clamp(1.5rem, 7vw, 2.8rem);
      border-radius: 4px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 6px 0 #9a0c12, 0 12px 30px rgba(232,36,44,0.35);
      animation: fadeUp 0.7s 0.3s ease both;
    }

    .call-btn:hover {
      background: #ff2d35;
      transform: translateY(-3px);
      box-shadow: 0 9px 0 #9a0c12, 0 18px 40px rgba(232,36,44,0.5);
    }

    .call-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #9a0c12, 0 6px 15px rgba(232,36,44,0.3);
    }

    .phone-icon {
      font-size: 1.8rem;
      animation: ring 2.5s ease infinite;
      display: inline-block;
    }

    @keyframes ring {
      0%,100% { transform: rotate(0deg); }
      5%       { transform: rotate(-20deg); }
      10%      { transform: rotate(20deg); }
      15%      { transform: rotate(-15deg); }
      20%      { transform: rotate(10deg); }
      25%      { transform: rotate(0deg); }
    }

    .number {
      font-size: 0.85rem;
      color: #555;
      margin-top: 1rem;
      letter-spacing: 0.15em;
      font-family: 'DM Sans', sans-serif;
      animation: fadeUp 0.7s 0.4s ease both;
    }

    .corner-tl, .corner-br {
      position: fixed;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: #2a2a2a;
      pointer-events: none;
    }
    .corner-tl { top: 1.5rem; left: 1.5rem; }
    .corner-br { bottom: 1.5rem; right: 1.5rem; }
    .qr-card {
      margin: 2.5rem auto 0;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      animation: fadeUp 0.7s 0.5s ease both;
    }

    .qr-svg {
      width: 180px;
      height: 180px;
      display: block;
      border-radius: 8px;
      box-shadow: 0 0 0 4px var(--red), 0 12px 30px rgba(0,0,0,0.5);
    }

    .qr-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.2em;
      color: var(--yellow);
    }
  </style>
</head>
